{% comment %}
    ANIMATSIYALANGAN FON — 21st.dev "Background Paths" (kokonutui) asosida,
    React/Motion'siz sof CSS animatsiya bilan qayta qurilgan.
    Rasm qo'shish uchun: core/settings.py da SITE_BG_IMAGE ga media/ ichidagi rasm yo'lini yozing.
{% endcomment %}
<div class="absolute inset-x-0 top-0 h-[60vh] md:h-[70vh] z-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-b from-blue-100/90 via-blue-50/50 to-transparent dark:from-[#0b1226]/95 dark:via-[#080c1a]/40 dark:to-transparent"></div>

    {% if BG_IMAGE_URL %}
    <div class="absolute inset-0 bg-cover bg-center opacity-45 dark:opacity-25" style="background-image:url('{{ BG_IMAGE_URL }}')"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-white/60 via-white/25 to-transparent dark:from-[#080c1a]/85 dark:via-[#080c1a]/40 dark:to-transparent"></div>
    {% endif %}

    <svg class="absolute inset-0 h-full w-full text-slate-900/40 dark:text-white/40" fill="none" preserveAspectRatio="xMidYMid slice" viewBox="-2400 -800 4800 1600">
        <defs>
            <linearGradient id="sharedGradient" x1="0%" x2="100%" y1="0%" y2="0%">
                <stop offset="0%" stop-color="rgba(147, 51, 234, 0.45)" />
                <stop offset="50%" stop-color="rgba(236, 72, 153, 0.45)" />
                <stop offset="100%" stop-color="rgba(59, 130, 246, 0.45)" />
            </linearGradient>
        </defs>
        <g class="bg-paths-primary"></g>
        <g class="bg-paths-secondary"></g>
        <g class="bg-paths-accent"></g>
    </svg>
</div>

<script>
(function () {
    function generateAestheticPath(index, position, type) {
        var baseAmplitude = type === 'primary' ? 150 : type === 'secondary' ? 100 : 60;
        var phase = index * 0.2;
        var segments = type === 'primary' ? 10 : type === 'secondary' ? 8 : 6;
        var startX = 2400, startY = 800, endX = -2400, endY = -800 + index * 25;
        var points = [];
        for (var i = 0; i <= segments; i++) {
            var progress = i / segments;
            var eased = 1 - Math.pow(1 - progress, 2);
            var baseX = startX + (endX - startX) * eased;
            var baseY = startY + (endY - startY) * eased;
            var amplitudeFactor = 1 - eased * 0.3;
            var wave1 = Math.sin(progress * Math.PI * 3 + phase) * (baseAmplitude * 0.7 * amplitudeFactor);
            var wave2 = Math.cos(progress * Math.PI * 4 + phase) * (baseAmplitude * 0.3 * amplitudeFactor);
            var wave3 = Math.sin(progress * Math.PI * 2 + phase) * (baseAmplitude * 0.2 * amplitudeFactor);
            points.push({ x: baseX * position, y: baseY + wave1 + wave2 + wave3 });
        }
        var d = '';
        for (var j = 0; j < points.length; j++) {
            var p = points[j];
            if (j === 0) { d += 'M ' + p.x + ' ' + p.y; continue; }
            var prev = points[j - 1];
            var tension = 0.4;
            var cp1x = prev.x + (p.x - prev.x) * tension, cp1y = prev.y;
            var cp2x = prev.x + (p.x - prev.x) * (1 - tension), cp2y = p.y;
            d += ' C ' + cp1x + ' ' + cp1y + ', ' + cp2x + ' ' + cp2y + ', ' + p.x + ' ' + p.y;
        }
        return d;
    }

    function addPaths(groupSel, count, type, position, opacityBase, opacityStep, widthBase, widthStep, amp) {
        var group = document.querySelector(groupSel);
        if (!group) return;
        var ns = 'http://www.w3.org/2000/svg';
        var duration = type === 'primary' ? 8 : type === 'secondary' ? 6 : 4;
        for (var i = 0; i < count; i++) {
            var path = document.createElementNS(ns, 'path');
            path.setAttribute('d', generateAestheticPath(i, position, type));
            path.setAttribute('stroke', 'url(#sharedGradient)');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-width', (widthBase + i * widthStep));
            path.setAttribute('fill', 'none');
            path.style.opacity = opacityBase + i * opacityStep;
            path.classList.add('bg-path-line');
            path.style.animationDuration = duration + 's';
            path.style.animationDelay = (i * 0.25) + 's';
            path.style.setProperty('--float-amp', amp + 'px');
            group.appendChild(path);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        addPaths('.bg-paths-primary', 12, 'primary', 1, 0.15, 0.02, 4, 0.3, -15);
        addPaths('.bg-paths-secondary', 15, 'secondary', 1, 0.12, 0.015, 3, 0.25, -10);
        addPaths('.bg-paths-accent', 10, 'accent', 1, 0.08, 0.12, 2, 0.2, -5);
    });
})();
</script>
